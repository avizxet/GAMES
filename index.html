<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive Snake game with food, wall collisions, and a maximum length challenge.">
  <title>Snake Garden</title>
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="game-shell">
    <section class="intro" aria-labelledby="game-title">
      <p class="eyebrow">Arcade / 01</p>
      <h1 id="game-title">Snake Garden</h1>
      <p class="intro-copy">Eat the glowing fruit, grow with every bite, and reach the garden's maximum length before the walls catch you.</p>
    </section>

    <section class="game-panel" aria-label="Snake game">
      <div class="hud">
        <div>
          <span class="hud-label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="hud-label">Length</span>
          <strong><span id="length">3</span><small> / <span id="max-length">60</span></small></strong>
        </div>
        <div class="status-wrap">
          <span class="hud-label">Status</span>
          <strong id="status" data-state="ready">Ready</strong>
        </div>
      </div>

      <div class="canvas-frame">
        <canvas id="game-canvas" width="600" height="600" aria-label="Snake game board"></canvas>
        <div class="message" id="message" role="status" aria-live="polite">
          <span class="message-kicker">Your move</span>
          <strong>Press an arrow key to begin</strong>
        </div>
      </div>

      <div class="controls-row">
        <div class="control-hint">
          <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
          <span>or arrow keys to steer</span>
        </div>
        <div class="actions">
          <button class="button button-quiet" id="pause-button" type="button">Pause</button>
          <button class="button button-primary" id="restart-button" type="button">Restart</button>
        </div>
      </div>
    </section>

    <footer class="footer-note">
      <span>Wall contact ends the run.</span>
      <span>Fill the board to win.</span>
    </footer>
  </main>
  <script src="scripts/game.js"></script>
</body>
</html>
